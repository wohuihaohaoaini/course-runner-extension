<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect width="1080" height="660" rx="20" fill="#f1f5f9"/><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#263d50}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#526a7c}.label{font-size:23px;font-weight:600}.body{font-size:19px}</style><text x="44" y="63" class="title">Edge 安装 · 按 1 → 4 操作</text><text x="44" y="101" class="sub">先下载 ZIP 并解压；下面的网址请复制到 Edge 顶部地址栏。</text><rect x="40" y="132" width="1000" height="98" rx="14" fill="white"/><circle cx="81" cy="180" r="22" fill="#217b99"/><text x="81" y="188" text-anchor="middle" style="fill:white;font-size:22px">1</text><text x="122" y="168" class="label">打开扩展管理页</text><text x="122" y="202" class="body">地址栏输入 edge://extensions，然后按回车。</text><rect x="40" y="245" width="1000" height="98" rx="14" fill="white"/><circle cx="81" cy="293" r="22" fill="#217b99"/><text x="81" y="301" text-anchor="middle" style="fill:white;font-size:22px">2</text><text x="122" y="281" class="label">打开「开发人员模式」</text><text x="122" y="315" class="body">通常在左侧栏下方；窄窗口时先展开侧栏或菜单。</text><rect x="40" y="358" width="1000" height="98" rx="14" fill="white"/><circle cx="81" cy="406" r="22" fill="#217b99"/><text x="81" y="414" text-anchor="middle" style="fill:white;font-size:22px">3</text><text x="122" y="394" class="label">点击「加载解压缩的扩展」</text><text x="122" y="428" class="body">按钮也可能叫「加载已解压的扩展程序」，选择 manifest.json 所在文件夹。</text><rect x="40" y="471" width="1000" height="98" rx="14" fill="white"/><circle cx="81" cy="519" r="22" fill="#217b99"/><text x="81" y="527" text-anchor="middle" style="fill:white;font-size:22px">4</text><text x="122" y="507" class="label">确认安装，并显示工具栏图标</text><text x="122" y="541" class="body">看到「课程流程助手」卡片后，从扩展菜单设置在工具栏显示。</text><text x="44" y="625" class="sub">课程流程助手 · 操作示意图（非浏览器截图），具体位置与文字以当前浏览器为准。</text></svg>