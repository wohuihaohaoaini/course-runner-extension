<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect width="1080" height="660" rx="20" fill="#f1f5f9"/><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#263d50}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#526a7c}.label{font-size:23px;font-weight:600}.body{font-size:19px}</style><text x="44" y="63" class="title">提示没有授权？先看是哪一种</text><text x="44" y="101" class="sub">「截图授权」「AI 开关」「接口密钥」是三件不同的事。</text><rect x="40" y="132" width="1000" height="98" rx="14" fill="white"/><circle cx="81" cy="180" r="22" fill="#217b99"/><text x="81" y="188" text-anchor="middle" style="fill:white;font-size:22px">1</text><text x="122" y="168" class="label">回到出现题目的课程标签页</text><text x="122" y="202" class="body">保持课程页在前台；不要停留在扩展管理页或其他网页。</text><rect x="40" y="245" width="1000" height="98" rx="14" fill="white"/><circle cx="81" cy="293" r="22" fill="#217b99"/><text x="81" y="301" text-anchor="middle" style="fill:white;font-size:22px">2</text><text x="122" y="281" class="label">点击浏览器上方拼图 → 再点击「课程流程助手」</text><text x="122" y="315" class="body">要点击插件名称或图标打开弹窗；仅展开列表或点图钉还不够。</text><rect x="40" y="358" width="1000" height="98" rx="14" fill="white"/><circle cx="81" cy="406" r="22" fill="#217b99"/><text x="81" y="414" text-anchor="middle" style="fill:white;font-size:22px">3</text><text x="122" y="394" class="label">关闭弹窗回到课程页，观察是否恢复</text><text x="122" y="428" class="body">若仍报错，再点「重新读取当前题目」；已跳过则先从待办回到原节。</text><rect x="40" y="471" width="1000" height="98" rx="14" fill="white"/><circle cx="81" cy="519" r="22" fill="#217b99"/><text x="81" y="527" text-anchor="middle" style="fill:white;font-size:22px">4</text><text x="122" y="507" class="label">仍然报错？核对原文</text><text x="122" y="541" class="body">密钥或接口状态码报错，请按 README 的对应条目处理。</text><text x="44" y="625" class="sub">课程流程助手 · 操作示意图（非浏览器截图），具体位置与文字以当前浏览器为准。</text></svg>